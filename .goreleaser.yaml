# GoReleaser config: the release path of M-001 (D-02, D-03, D-05, D-06).
# Check it with `goreleaser check`; build it locally, without publishing,
# with `make snapshot`.
version: 2

project_name: wanonymizer

builds:
  - id: wanonymizer
    main: ./cmd/wanonymizer
    binary: wanonymizer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Equal inputs give equal binaries: the file time is the commit time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: wanonymizer
    ids:
      - wanonymizer
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: wanonymizer
    ids:
      - wanonymizer
    package_name: wanonymizer
    formats:
      - deb
      - rpm
    license: MIT
    # D-02: the name only, with no email.
    maintainer: Stefano Ginella
    homepage: https://github.com/stefanoginella/wanonymizer
    description: >-
      Command-line filter that replaces or removes personal data and keys
      in WordPress SQL dumps.

homebrew_casks:
  - name: wanonymizer
    ids:
      - wanonymizer
    binaries:
      - wanonymizer
    homepage: https://github.com/stefanoginella/wanonymizer
    description: >-
      Command-line filter that replaces or removes personal data and keys
      in WordPress SQL dumps
    repository:
      owner: stefanoginella
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # D-05: the binaries are unsigned, so the cask removes the quarantine
    # attribute that macOS sets on the download.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/wanonymizer"]
          end
