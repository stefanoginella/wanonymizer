version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nolintlint
  settings:
    forbidigo:
      # stdout carries the dump: write only through an explicit io.Writer.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: write to an explicit io.Writer
        - pattern: ^print$
          msg: write to an explicit io.Writer
        - pattern: ^println$
          msg: write to an explicit io.Writer
    nolintlint:
      require-explanation: true
      require-specific: true
