# Release (M-001 D-05, D-06): a pushed v* tag publishes the GitHub
# release, the Homebrew cask, and a build provenance attestation for each
# file of checksums.txt. Only the release job holds write permissions and
# the tap token.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release and its assets.
      contents: write
      # The OIDC token for the Sigstore signing certificate.
      id-token: write
      # The attestations of D-06. No artifact-metadata: actions/attest
      # writes a storage record only with push-to-registry.
      attestations: write
    steps:
      # Full history and tags: GoReleaser builds the changelog from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No cache: a release must not restore a cache that another run
      # could have written.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The version is GORELEASER_VERSION of scripts/install-tools.sh;
      # change both together.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
